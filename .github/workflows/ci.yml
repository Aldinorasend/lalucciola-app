name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholder: the build needs it set but never signs tokens.
      AUTH_SECRET: ci-placeholder-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx next typegen
          npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
