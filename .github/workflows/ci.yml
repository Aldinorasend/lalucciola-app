name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Throwaway database for the booking tests (tests/db).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Placeholder: the build needs it set but never signs tokens.
      AUTH_SECRET: ci-placeholder-secret
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # postinstall runs `prisma generate`
      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: |
          npx next typegen
          npm run typecheck

      - name: Test
        run: npm test

      - name: Database tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npx prisma migrate deploy
          npm run test:db

      - name: Build
        run: npm run build
